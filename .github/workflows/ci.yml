name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Format check
        run: stylua --check src
      - name: Lint
        run: selene src
      - name: Build place
        run: rojo build -o build.rbxl
